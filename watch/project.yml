name: GlitchifyWatch
options:
  minimumXcodeGenVersion: 2.42.0
  xcodeVersion: '16.4'
  deploymentTarget:
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CURRENT_PROJECT_VERSION: '3.5.3'
    MARKETING_VERSION: '3.5.3'
targets:
  GlitchifyWatch:
    type: application
    platform: watchOS
    deploymentTarget: '10.0'
    sources:
      - path: GlitchifyWatchApp.swift
      - path: WatchTestView.swift
      - path: LocalAudioDiagnostic.swift
      - path: Generated/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spotify.client.glitchifywatch
        PRODUCT_NAME: GlitchifyWatch
        TARGETED_DEVICE_FAMILY: '4'
        ARCHS: $(ARCHS_STANDARD)
        ONLY_ACTIVE_ARCH: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: NO
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Glitchify Test
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.spotify.client
        WKRunsIndependentlyOfCompanionApp: true
        WKWatchOnly: false
        GlitchifyPrototypeRevision: 1.1-speaker-probe.1
    scheme:
      gatherCoverageData: false
